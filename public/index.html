<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KASU Resolve | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrap">
    <div class="brand-panel">
      <div class="logo-badge"><img src="/images/kasu-logo.png" alt="KASU logo"></div>
      <h1>KASU Resolve</h1>
      <div class="tagline">Speak. Track. Resolved.</div>
      <div class="motto">Knowledge for Development and Unity</div>
    </div>

    <div class="form-panel">
      <div class="auth-card">
        <h2 class="mb-1">Welcome back</h2>
        <p class="text-muted mb-4">Log in to submit and track your complaints.</p>

        <div id="msg" class="alert d-none"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-kasu w-100 py-2">Log in</button>
        </form>

        <p class="mt-4 mb-0 text-center">New student? <a href="/register.html">Create an account</a></p>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
