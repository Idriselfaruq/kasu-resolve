<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KASU Resolve | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrap">
    <div class="brand-panel">
      <div class="logo-badge"><img src="/images/kasu-logo.png" alt="KASU logo"></div>
      <h1>KASU Resolve</h1>
      <div class="tagline">Speak. Track. Resolved.</div>
      <div class="motto">Knowledge for Development and Unity</div>
    </div>

    <div class="form-panel">
      <div class="auth-card">
        <h2 class="mb-1">Create your account</h2>
        <p class="text-muted mb-4">Use your real matric number so staff can find your records.</p>

        <div id="msg" class="alert d-none"></div>

        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="full_name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Matric number</label>
            <input type="text" name="matric_number" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Faculty</label>
              <input type="text" name="faculty" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Department</label>
              <input type="text" name="department" class="form-control">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password (min. 6 characters)</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="form-check mb-3">
  <input class="form-check-input" type="checkbox" id="showPassword">
  <label class="form-check-label" for="showPassword">Show password</label>
</div>
          <button type="submit" class="btn btn-kasu w-100 py-2">Register</button>
        </form>

        <p class="mt-4 mb-0 text-center">Already registered? <a href="/index.html">Log in</a></p>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
