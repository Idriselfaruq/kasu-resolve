<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KASU Resolve | Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body style="background: var(--kasu-light);">

  <nav class="navbar" style="background: var(--kasu-dark);">
    <div class="container">
      <span class="navbar-brand text-white fw-bold d-flex align-items-center">
        <img src="/images/kasu-logo.png" alt="KASU logo" width="38" height="38" class="me-2 bg-white rounded-circle p-1">
        KASU Resolve <span class="badge ms-2" style="background: var(--kasu-gold); color: var(--ink);">Admin</span>
      </span>
      <div class="text-white">
        <span id="adminName"></span>
        <button id="logoutBtn" class="btn btn-sm btn-warning ms-3">Log out</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="p-3 rounded text-white" style="background: var(--kasu-dark);">
          <div class="small">All complaints</div>
          <div class="fs-2 fw-bold" id="statTotal">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="p-3 rounded text-white" style="background: var(--kasu-red);">
          <div class="small">Pending</div>
          <div class="fs-2 fw-bold" id="statPending">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="p-3 rounded" style="background: var(--kasu-gold); color: var(--ink);">
          <div class="small">In Progress</div>
          <div class="fs-2 fw-bold" id="statProgress">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="p-3 rounded text-white" style="background: var(--kasu-green);">
          <div class="small">Resolved</div>
          <div class="fs-2 fw-bold" id="statResolved">0</div>
        </div>
      </div>
    </div>

    <div class="auth-card" style="max-width: 100%;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h4 class="mb-0">All complaints</h4>
        <div class="d-flex gap-2">
          <select id="filterStatus" class="form-select form-select-sm">
            <option value="">All statuses</option>
            <option>Pending</option>
            <option>In Progress</option>
            <option>Resolved</option>
          </select>
          <select id="filterCategory" class="form-select form-select-sm">
            <option value="">All categories</option>
          </select>
        </div>
      </div>

      <div id="msg" class="alert d-none"></div>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Tracking ID</th><th>Student</th><th>Matric no.</th>
              <th>Title</th><th>Category</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="complaintRows">
            <tr><td colspan="7" class="text-muted">Nothing loaded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
    <div class="modal fade" id="complaintModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header" style="background: var(--kasu-dark); color: #fff;">
          <h5 class="modal-title" id="modalTitle">Complaint</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <div><strong>Student:</strong> <span id="modalStudent"></span></div>
            <div><strong>Category:</strong> <span id="modalCategory"></span></div>
            <div><strong>Status:</strong> <span id="modalStatus"></span></div>
          </div>

          <h6>What the student wrote</h6>
          <p id="modalDescription" class="p-3 rounded" style="background: var(--kasu-light);"></p>

          <h6>Replies</h6>
          <div id="modalReplies" class="mb-3"></div>

          <div id="modalMsg" class="alert d-none"></div>

          <h6>Write a reply</h6>
          <textarea id="replyText" rows="3" class="form-control mb-2"></textarea>
          <select id="replyStatus" class="form-select">
            <option value="">Keep the current status</option>
            <option>Pending</option>
            <option>In Progress</option>
            <option>Resolved</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" id="sendReplyBtn" class="btn btn-kasu">Send reply</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
