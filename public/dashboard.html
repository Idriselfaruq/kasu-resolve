<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KASU Resolve | My Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body style="background: var(--kasu-light);">

  <nav class="navbar" style="background: var(--kasu-dark);">
    <div class="container">
      <span class="navbar-brand text-white fw-bold d-flex align-items-center">
        <img src="/images/kasu-logo.png" alt="KASU logo" width="38" height="38" class="me-2 bg-white rounded-circle p-1">
        KASU Resolve
      </span>
      <div class="text-white">
        <span id="studentName"></span>
        <button id="logoutBtn" class="btn btn-sm btn-warning ms-3">Log out</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row g-4">

      <div class="col-lg-5">
        <div class="auth-card" style="max-width: 100%;">
          <h4>Submit a complaint</h4>
          <div id="msg" class="alert d-none"></div>
          <form id="complaintForm">
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select name="category" id="categorySelect" class="form-select" required></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Describe the problem</label>
              <textarea name="description" rows="4" class="form-control" required></textarea>
            </div>
            <button type="submit" class="btn btn-kasu w-100 py-2">Submit complaint</button>
          </form>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="auth-card" style="max-width: 100%;">
          <h4>My complaints</h4>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr><th>Tracking ID</th><th>Title</th><th>Category</th><th>Status</th><th></th></tr>
              </thead>
              <tbody id="complaintRows">
                <tr><td colspan="4" class="text-muted">Nothing loaded yet.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
    <div class="modal fade" id="complaintModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header" style="background: var(--kasu-dark); color: #fff;">
          <h5 class="modal-title" id="modalTitle">Complaint</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <div><strong>Category:</strong> <span id="modalCategory"></span></div>
            <div><strong>Status:</strong> <span id="modalStatus"></span></div>
          </div>

          <h6>What you wrote</h6>
          <p id="modalDescription" class="p-3 rounded" style="background: var(--kasu-light);"></p>

          <h6>Replies from KASU staff</h6>
          <div id="modalReplies"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
